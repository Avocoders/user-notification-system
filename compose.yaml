services:
  kafka:
    image: apache/kafka:4.0.1
    container_name: user-system-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  mailpit:
    image: axllent/mailpit:v1.27.8
    container_name: user-system-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  postgresql:
    image: postgres:18
    container_name: user-system-postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: user_service_spring
      POSTGRES_USER: user_name
      POSTGRES_PASSWORD: ${DB_PASSWORD}
